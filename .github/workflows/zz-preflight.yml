name: buildbot preflight (android x86_64)
on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64]
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      API_LEVEL: 21
      CORE_ARGS: -DENABLE_TESTS=OFF -DENABLE_DEDICATED_ROOM=OFF -DENABLE_SDL2=OFF -DENABLE_QT=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_SCRIPTING=OFF -DENABLE_OPENAL=OFF -DENABLE_LIBUSB=OFF -DCITRA_ENABLE_BUNDLE_TARGET=OFF -DCITRA_WARNINGS_AS_ERRORS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;$ANDROID_NDK_VERSION"
      - name: Build (replays the android-cmake template)
        run: |
          export NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/$ANDROID_NDK_VERSION
          cmake -DCMAKE_BUILD_TYPE=Release $CORE_ARGS \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_STL=c++_static -DANDROID_ABI=${{ matrix.abi }} \
            . -Bbuild/android-${{ matrix.abi }}
          cmake --build build/android-${{ matrix.abi }} --target citra_libretro --config Release -- -j$(nproc)
      - name: Check
        run: |
          f=$(find build/android-${{ matrix.abi }} -name "citra_libretro.so" | head -1)
          echo "$f"; ls -l "$f"; file "$f"
