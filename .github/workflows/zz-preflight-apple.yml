name: buildbot preflight (apple)
on: [push, workflow_dispatch]

env:
  CORE_ARGS: -DENABLE_TESTS=OFF -DENABLE_DEDICATED_ROOM=OFF -DENABLE_SDL2=OFF -DENABLE_QT=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_SCRIPTING=OFF -DENABLE_OPENAL=OFF -DENABLE_LIBUSB=OFF -DCITRA_ENABLE_BUNDLE_TARGET=OFF -DCITRA_WARNINGS_AS_ERRORS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5

jobs:
  osx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: osx-arm64, runner: macos-15,        extra: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_APPLE_SILICON_PROCESSOR=arm64 -DCMAKE_SYSTEM_PROCESSOR=arm64" }
          - { name: osx-x64,   runner: macos-15-intel,  extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64" }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Raise the minimum macOS the tree pins (11.0) to what std::format needs
        run: sed -i '' 's/set(CMAKE_OSX_DEPLOYMENT_TARGET "11.0")/set(CMAKE_OSX_DEPLOYMENT_TARGET "13.3")/' CMakeLists.txt
      - run: cmake -DCMAKE_BUILD_TYPE=Release $CORE_ARGS . -Bbuild/${{ matrix.name }} ${{ matrix.extra }}
      - run: cmake --build build/${{ matrix.name }} --target citra_libretro --config Release -- -j$(sysctl -n hw.ncpu)
      - run: |
          f=$(find build/${{ matrix.name }} -name "citra_libretro.dylib" | head -1)
          echo "$f"; lipo -info "$f"; otool -L "$f" | head -5
