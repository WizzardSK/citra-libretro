name: buildbot preflight (apple)
on: [push, workflow_dispatch]

env:
  CORE_ARGS: -DENABLE_TESTS=OFF -DENABLE_DEDICATED_ROOM=OFF -DENABLE_SDL2=OFF -DENABLE_QT=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_SCRIPTING=OFF -DENABLE_OPENAL=OFF -DENABLE_LIBUSB=OFF -DCITRA_ENABLE_BUNDLE_TARGET=OFF -DCITRA_WARNINGS_AS_ERRORS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5

jobs:
  osx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: osx-arm64, runner: macos-15,        extra: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_APPLE_SILICON_PROCESSOR=arm64 -DCMAKE_SYSTEM_PROCESSOR=arm64" }
          - { name: osx-x64,   runner: macos-15-intel,  extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64" }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: cmake -DCMAKE_BUILD_TYPE=Release $CORE_ARGS . -Bbuild/${{ matrix.name }} ${{ matrix.extra }}
      - run: cmake --build build/${{ matrix.name }} --target citra_libretro --config Release -- -j$(sysctl -n hw.ncpu)
      - run: |
          f=$(find build/${{ matrix.name }} -name "citra_libretro.dylib" | head -1)
          echo "$f"; lipo -info "$f"; otool -L "$f" | head -5

  apple-embedded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ios-arm64,  system: iOS,  minver: "13.0" }
          - { name: tvos-arm64, system: tvOS, minver: "13.0" }
    runs-on: macos-15
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Configure (replays the ios/tvos-cmake template)
        run: |
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-DIOS" -DCMAKE_CXX_FLAGS="-DIOS" \
            -DIOS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.minver }} \
            -DCMAKE_SYSTEM_NAME=${{ matrix.system }} \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            $CORE_ARGS . -Bbuild/${{ matrix.name }}
      - run: cmake --build build/${{ matrix.name }} --target citra_libretro --config RelWithDebInfo -- -j$(sysctl -n hw.ncpu)
      - run: |
          f=$(find build/${{ matrix.name }} -name "citra_libretro.dylib" | head -1)
          echo "$f"; lipo -info "$f"
